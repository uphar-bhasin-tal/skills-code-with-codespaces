name: Use ArchLint

on:
  pull_request:
    branches: [ main ]

jobs:
  architecture-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Use ArchLint
        uses: yourname/archlint-action@main  # Replace with actual repo
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload Report
        uses: actions/upload-artifact@v3
        with:
          name: architectural_review
          path: architectural_review.md
